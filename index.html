<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Web Photobooth</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    /* Background Motif Polka-Dot Soft & Estetik */
    body {
      background-color: #fdf2f8;
      background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      color: #831843;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 25px 20px;
      box-shadow: 0 15px 35px rgba(244, 114, 182, 0.15);
      border: 2px solid #fbcfe8;
      text-align: center;
      position: relative;
    }

    /* Animasi Floating untuk Pita & Elemen Header */
    @keyframes floatRibbon {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .ribbon-icon {
      font-size: 3.2rem;
      color: #f43f5e;
      display: inline-block;
      animation: floatRibbon 3s ease-in-out infinite;
      margin-bottom: 5px;
      filter: drop-shadow(0 4px 6px rgba(244, 63, 94, 0.2));
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #9f1239;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.85rem;
      color: #be123c;
      margin-bottom: 20px;
    }

    /* Mode View Control */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Button Styling + Animasi Hover */
    .btn {
      background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
      color: white;
      font-weight: 600;
      border: none;
      padding: 12px 20px;
      border-radius: 18px;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      margin-top: 10px;
      box-shadow: 0 6px 15px rgba(244, 63, 94, 0.25);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(244, 63, 94, 0.35);
    }

    .btn:active { transform: scale(0.97); }

    .btn-secondary {
      background: #fecdd3;
      color: #9f1239;
      box-shadow: none;
    }

    .btn-secondary:hover { background: #fbe1e6; }

    /* Camera Area */
    .camera-box {
      width: 100%;
      height: 280px;
      background: #18181b;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
      border: 3px solid #fda4af;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 700;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .countdown-overlay.show { opacity: 1; }

    /* Canvas & Photo Strip Preview */
    .strip-container {
      position: relative;
      display: inline-block;
      margin: 15px 0;
      max-width: 100%;
    }

    canvas {
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      max-width: 100%;
      height: auto;
    }

    /* Overlay Emoji Layer */
    .emoji-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }

    .placed-emoji {
      position: absolute;
      pointer-events: auto;
      cursor: move;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed transparent;
      padding: 4px;
      border-radius: 8px;
    }

    .placed-emoji:hover, .placed-emoji.selected {
      border-color: #f43f5e;
      background: rgba(255, 255, 255, 0.4);
    }

    /* Emoji Action Controls (Hapus & Resize) */
    .emoji-controls {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 6px;
      background: white;
      padding: 4px 8px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .placed-emoji:hover .emoji-controls,
    .placed-emoji.selected .emoji-controls {
      display: flex;
    }

    .emoji-btn-del {
      background: #ef4444;
      color: white;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-slider {
      width: 60px;
      accent-color: #f43f5e;
      cursor: pointer;
    }

    /* Custom Controls (Frame & Emoji Picker) */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      text-align: left;
    }

    .control-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #9f1239;
      margin-bottom: 5px;
    }

    .color-options {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .color-dot:hover { transform: scale(1.15); }

    .emoji-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
      font-size: 1.5rem;
      background: #fff1f2;
      padding: 10px;
      border-radius: 16px;
    }

    .emoji-item {
      cursor: pointer;
      transition: transform 0.2s;
    }

    .emoji-item:hover { transform: scale(1.3); }

    footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #be123c;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HOMEPAGE VIEW -->
    <div id="homeView" class="view-section active">
      <div class="ribbon-icon">🎀</div>
      <header>
        <h1>Photobooth Web</h1>
        <p>Bikin Photo Strip Aesthetic secara Instan & Gratis!</p>
      </header>
      <button class="btn" onclick="startCamera()"><i class="fa-solid fa-camera"></i> Ambil Foto Langsung</button>
      <label class="btn btn-secondary" style="margin-top: 10px; cursor: pointer;">
        <i class="fa-solid fa-image"></i> Upload Foto dari Galeri
        <input type="file" id="uploadInput" accept="image/*" multiple style="display: none;" onchange="handleUpload(event)">
      </label>
    </div>

    <!-- CAMERA VIEW -->
    <div id="cameraView" class="view-section">
      <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <div id="countdown" class="countdown-overlay">3</div>
      </div>
      <button id="snapBtn" class="btn" onclick="takePhotos()"><i class="fa-solid fa-aperture"></i> Mulai Foto (3 Pose)</button>
      <button class="btn btn-secondary" onclick="resetApp()">Kembali</button>
    </div>

    <!-- RESULT VIEW -->
    <div id="resultView" class="view-section">
      <header>
        <h1 style="font-size: 1.2rem;">Hasil Photo Strip Kamu ✨</h1>
      </header>

      <div class="strip-container" id="stripContainer">
        <canvas id="photoCanvas"></canvas>
        <div class="emoji-layer" id="emojiLayer"></div>
      </div>

      <div class="controls-panel">
        <div>
          <div class="control-label"><i class="fa-solid fa-palette"></i> Pilih Warna Frame:</div>
          <div class="color-options">
            <div class="color-dot" style="background: #ffffff;" onclick="changeFrameColor('#ffffff')"></div>
            <div class="color-dot" style="background: #ffe4e6;" onclick="changeFrameColor('#ffe4e6')"></div>
            <div class="color-dot" style="background: #fbcfe8;" onclick="changeFrameColor('#fbcfe8')"></div>
            <div class="color-dot" style="background: #dcfce7;" onclick="changeFrameColor('#dcfce7')"></div>
            <div class="color-dot" style="background: #18181b;" onclick="changeFrameColor('#18181b')"></div>
          </div>
        </div>

        <div>
          <div class="control-label"><i class="fa-solid fa-icons"></i> Tambah Stiker Emoji (Klik untuk tempel):</div>
          <div class="emoji-picker">
            <span class="emoji-item" onclick="addEmoji('🎀')">🎀</span>
            <span class="emoji-item" onclick="addEmoji('✨')">✨</span>
            <span class="emoji-item" onclick="addEmoji('🤍')">🤍</span>
            <span class="emoji-item" onclick="addEmoji('🧸')">🧸</span>
            <span class="emoji-item" onclick="addEmoji('🌸')">🌸</span>
          </div>
        </div>
      </div>

      <button class="btn" onclick="downloadStrip()"><i class="fa-solid fa-download"></i> Download Hasil PNG</button>
      <button class="btn btn-secondary" onclick="resetApp()">Foto Ulang</button>
    </div>

    <footer>Nazwa Sri Rahayu | SMAN 1 Cijeruk</footer>
  </div>

  <script>
    const homeView = document.getElementById('homeView');
    const cameraView = document.getElementById('cameraView');
    const resultView = document.getElementById('resultView');
    const video = document.getElementById('video');
    const countdownEl = document.getElementById('countdown');
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');
    const emojiLayer = document.getElementById('emojiLayer');

    let stream = null;
    let capturedImages = [];
    let currentFrameColor = '#ffffff';

    function showView(view) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      view.classList.add('active');
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        showView(cameraView);
      } catch (err) {
        alert("Gagal mengakses kamera. Pastikan memberikan izin kamera di browser kamu.");
      }
    }

    function takePhotos() {
      capturedImages = [];
      document.getElementById('snapBtn').style.display = 'none';
      let count = 3;

      const takeNextPhoto = (index) => {
        let timer = 3;
        countdownEl.innerText = timer;
        countdownEl.classList.add('show');

        const interval = setInterval(() => {
          timer--;
          if (timer > 0) {
            countdownEl.innerText = timer;
          } else {
            clearInterval(interval);
            countdownEl.classList.remove('show');
            
            // Capture image
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 640;
            tempCanvas.height = video.videoHeight || 480;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0);
            capturedImages.push(tempCanvas.toDataURL('image/png'));

            if (index < 2) {
              setTimeout(() => takeNextPhoto(index + 1), 1000);
            } else {
              stopCamera();
              renderStrip();
              showView(resultView);
            }
          }
        }, 1000);
      };

      takeNextPhoto(0);
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('snapBtn').style.display = 'flex';
    }

    function handleUpload(e) {
      const files = Array.from(e.target.files).slice(0, 3);
      if (files.length < 3) {
        alert("Pilih 3 foto dari galeri!");
        return;
      }
      capturedImages = [];
      let loaded = 0;

      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          capturedImages[idx] = event.target.result;
          loaded++;
          if (loaded === 3) {
            renderStrip();
            showView(resultView);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function renderStrip() {
      const width = 360;
      const photoHeight = 240;
      const padding = 20;
      const gap = 15;
      const bottomSpace = 60;

      canvas.width = width;
      canvas.height = padding + (photoHeight * 3) + (gap * 2) + bottomSpace;

      // Draw Frame Background
      ctx.fillStyle = currentFrameColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let loadedCount = 0;
      capturedImages.forEach((src, i) => {
        const img = new Image();
        img.onload = () => {
          const y = padding + i * (photoHeight + gap);
          
          // Crop Center (Anti-Gepeng)
          const imgAspect = img.width / img.height;
          const targetAspect = (width - (padding * 2)) / photoHeight;
          let sx, sy, sWidth, sHeight;

          if (imgAspect > targetAspect) {
            sHeight = img.height;
            sWidth = img.height * targetAspect;
            sx = (img.width - sWidth) / 2;
            sy = 0;
          } else {
            sWidth = img.width;
            sHeight = img.width / targetAspect;
            sx = 0;
            sy = (img.height - sHeight) / 2;
          }

          ctx.drawImage(img, sx, sy, sWidth, sHeight, padding, y, width - (padding * 2), photoHeight);

          loadedCount++;
          if (loadedCount === 3) {
            // Draw Date Footer
            ctx.fillStyle = (currentFrameColor === '#18181b') ? '#ffffff' : '#831843';
            ctx.font = '600 13px Poppins';
            ctx.textAlign = 'center';
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            ctx.fillText(`★ PHOTOBOOTH • ${dateStr} ★`, width / 2, canvas.height - 22);
          }
        };
        img.src = src;
      });
    }

    function changeFrameColor(color) {
      currentFrameColor = color;
      renderStrip();
    }

    // Dynamic Emoji System (Drag, Resize & Delete)
    function addEmoji(emojiChar) {
      const emojiContainer = document.createElement('div');
      emojiContainer.className = 'placed-emoji';
      emojiContainer.style.left = '40%';
      emojiContainer.style.top = '40%';

      const textEl = document.createElement('span');
      textEl.innerText = emojiChar;
      textEl.style.fontSize = '32px';

      const controls = document.createElement('div');
      controls.className = 'emoji-controls';

      // Slider Resize
      const slider = document.createElement('input');
      slider.type = 'range';
      slider.className = 'emoji-slider';
      slider.min = '16';
      slider.max = '72';
      slider.value = '32';
      slider.oninput = (e) => { textEl.style.fontSize = `${e.target.value}px`; };

      // Delete Button
      const delBtn = document.createElement('button');
      delBtn.className = 'emoji-btn-del';
      delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      delBtn.onclick = (e) => {
        e.stopPropagation();
        emojiContainer.remove();
      };

      controls.appendChild(slider);
      controls.appendChild(delBtn);
      emojiContainer.appendChild(controls);
      emojiContainer.appendChild(textEl);

      makeDraggable(emojiContainer);
      emojiLayer.appendChild(emojiContainer);
    }

    function makeDraggable(element) {
      let posX = 0, posY = 0, mouseX = 0, mouseY = 0;

      element.onmousedown = dragMouseDown;
      element.ontouchstart = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        const event = e.touches ? e.touches[0] : e;
        mouseX = event.clientX;
        mouseY = event.clientY;

        document.onmouseup = closeDragElement;
        document.ontouchend = closeDragElement;
        document.onmousemove = elementDrag;
        document.ontouchmove = elementDrag;
      }

      function elementDrag(e) {
        const event = e.touches ? e.touches[0] : e;
        posX = mouseX - event.clientX;
        posY = mouseY - event.clientY;
        mouseX = event.clientX;
        mouseY = event.clientY;

        element.style.top = (element.offsetTop - posY) + "px";
        element.style.left = (element.offsetLeft - posX) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
        document.ontouchend = null;
        document.ontouchmove = null;
      }
    }

    function downloadStrip() {
      // Export Canvas + Overlay Emojis
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.drawImage(canvas, 0, 0);

      const emojis = emojiLayer.querySelectorAll('.placed-emoji');
      emojis.forEach(el => {
        const rect = el.getBoundingClientRect();
        const layerRect = emojiLayer.getBoundingClientRect();
        const scale = canvas.width / layerRect.width;

        const x = (rect.left - layerRect.left) * scale;
        const y = (rect.top - layerRect.top) * scale;
        const fontPx = parseFloat(window.getComputedStyle(el.querySelector('span')).fontSize) * scale;
        const text = el.querySelector('span').innerText;

        exportCtx.font = `${fontPx}px serif`;
        exportCtx.textAlign = 'left';
        exportCtx.textBaseline = 'top';
        exportCtx.fillText(text, x, y + (4 * scale));
      });

      const link = document.createElement('a');
      link.download = `photobooth-${Date.now()}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }

    function resetApp() {
      stopCamera();
      emojiLayer.innerHTML = '';
      showView(homeView);
    }
  </script>
</body>
  </html>
