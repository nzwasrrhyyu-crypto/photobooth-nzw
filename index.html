<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth IX-6</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      color: #1e293b;
    }

    /* Container untuk Mengontrol Tampilan Halaman (Multi-View) */
    .view {
      display: none;
      width: 100%;
      max-width: 440px;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0284c7;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.9rem;
      color: #64748b;
    }

    /* Card Box Styles */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Video / Camera Box */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #0f172a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.2);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video.mirror {
      transform: scaleX(-1);
    }

    /* Overlay Countdown */
    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5.5rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .countdown-overlay.active {
      opacity: 1;
    }

    /* Controls Layout */
    .controls {
      width: 100%;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .option-box {
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Custom Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(18px); }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-outline {
      background: transparent;
      border: 2px stroke #0284c7;
      border: 2px solid #0284c7;
      color: #0284c7;
      box-shadow: none;
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }

    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      margin: 10px 0;
      width: 100%;
    }

    .divider::before, .divider::after {
      content: ''; flex: 1; border-bottom: 1px solid #cbd5e1;
    }

    .divider span { padding: 0 10px; }

    /* Preview Result Frame */
    .strip-preview {
      max-width: 210px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      margin-bottom: 20px;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <!-- ==================== 1. HOMEPAGE VIEW ==================== -->
  <div id="homeView" class="view active">
    <header>
      <h1><i class="fa-solid fa-camera-retro"></i> Photobooth Web</h1>
      <p>Capture your moment</p>
    </header>

    <div class="card" style="gap: 15px;">
      <div style="font-size: 4rem; color: #0284c7; margin: 10px 0;">📸</div>
      <h2 style="font-size: 1.2rem; color: #1e293b;">Siap Buat Photo Strip?</h2>
      <p style="font-size: 0.85rem; color: #64748b; line-height: 1.4;">
        Ambil 3 foto seru bersama teman-temanmu secara langsung atau upload gambar dari galerimu!
      </p>

      <button id="startHomeBtn" class="btn btn-primary" style="margin-top: 10px;">
        <i class="fa-solid fa-circle-play"></i> Mulai Photobooth
      </button>
    </div>
  </div>

  <!-- ==================== 2. CAMERA & UPLOAD VIEW ==================== -->
  <div id="cameraView" class="view">
    <header>
      <h1><i class="fa-solid fa-camera-retro"></i> Photobooth Web</h1>
      <p>Capture your moment</p>
    </header>

    <div class="card">
      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline class="mirror"></video>
        <div id="countdown" class="countdown-overlay">3</div>
      </div>

      <div class="controls">
        <div class="options-grid">
          <!-- Toggle Mirror -->
          <div class="option-box">
            <span><i class="fa-solid fa-arrows-left-right"></i> Mirror</span>
            <label class="switch">
              <input type="checkbox" id="mirrorToggle" checked>
              <span class="slider"></span>
            </label>
          </div>

          <!-- Switch Kamera (Depan/Belakang) -->
          <button id="switchCamBtn" class="option-box" style="cursor: pointer; border: none;">
            <span><i class="fa-solid fa-camera-rotate"></i> Kamera</span>
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>

        <!-- Tombol Ambil Foto -->
        <button id="startBtn" class="btn btn-primary">
          <i class="fa-solid fa-camera"></i> Mulai Foto (3 Pose)
        </button>

        <div class="divider"><span>Atau</span></div>

        <!-- Fitur Upload Galeri -->
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
        <button id="uploadBtn" class="btn btn-outline">
          <i class="fa-solid fa-file-arrow-up"></i> Upload 3 Foto dari Galeri
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 3. RESULT VIEW ==================== -->
  <div id="resultView" class="view">
    <header>
      <h1><i class="fa-solid fa-face-smile"></i> Hasil Photo Strip</h1>
      <p>Photobooth Class IX-6</p>
    </header>

    <div class="card">
      <img id="stripImg" class="strip-preview" alt="Photo Strip IX-6">

      <div class="controls">
        <button id="downloadBtn" class="btn btn-success">
          <i class="fa-solid fa-download"></i> Cetak / Download (PNG)
        </button>
        <button id="retakeBtn" class="btn btn-secondary">
          <i class="fa-solid fa-rotate-left"></i> Foto Ulang
        </button>
      </div>
    </div>
  </div>

  <!-- Canvas Tersembunyi untuk Pemrosesan Foto -->
  <canvas id="canvas"></canvas>

  <script>
    // --- ELEMENT REFERENCES ---
    const homeView = document.getElementById('homeView');
    const cameraView = document.getElementById('cameraView');
    const resultView = document.getElementById('resultView');

    const startHomeBtn = document.getElementById('startHomeBtn');
    const video = document.getElementById('webcam');
    const mirrorToggle = document.getElementById('mirrorToggle');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const startBtn = document.getElementById('startBtn');
    const countdownEl = document.getElementById('countdown');
    
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');

    const stripImg = document.getElementById('stripImg');
    const downloadBtn = document.getElementById('downloadBtn');
    const retakeBtn = document.getElementById('retakeBtn');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let isMirror = true;
    let currentFacingMode = 'user'; // 'user' (Depan) atau 'environment' (Belakang)
    let currentStream = null;

    // --- AUDIO SYSTEM (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeepSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playShutterSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // --- SWITCH VIEWS ---
    function showView(viewToShow) {
      [homeView, cameraView, resultView].forEach(view => view.classList.remove('active'));
      viewToShow.classList.add('active');
    }

    // --- STARTHOME BUTTON ---
    startHomeBtn.addEventListener('click', () => {
      showView(cameraView);
      initCamera();
    });

    // --- 1. KAMERA ENGINE ---
    function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: currentFacingMode,
          width: { ideal: 1280 }, 
          height: { ideal: 960 } 
        }, 
        audio: false 
      })
      .then(stream => {
        currentStream = stream;
        video.srcObject = stream;
      })
      .catch(err => {
        alert("Gagal mengakses kamera. Pastikan izin kamera telah diberikan!");
      });
    }

    // Mirror Toggle
    mirrorToggle.addEventListener('change', (e) => {
      isMirror = e.target.checked;
      if (isMirror) video.classList.add('mirror');
      else video.classList.remove('mirror');
    });

    // Switch Kamera Depan/Belakang
    switchCamBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      initCamera();
    });

    // --- 2. PROSES AMBIL FOTO KAMERA ---
    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      uploadBtn.disabled = true;
      const capturedPhotos = [];

      for (let i = 1; i <= 3; i++) {
        await runCountdown(3);
        playShutterSound();
        
        countdownEl.innerText = "📸";
        countdownEl.classList.add('active');
        await new Promise(r => setTimeout(r, 200));
        countdownEl.classList.remove('active');

        capturedPhotos.push(captureSingleFrame());
      }

      generatePhotoStrip(capturedPhotos);
      startBtn.disabled = false;
      uploadBtn.disabled = false;
    });

    function runCountdown(seconds) {
      return new Promise(resolve => {
        let count = seconds;
        countdownEl.innerText = count;
        countdownEl.classList.add('active');
        playBeepSound();

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
            playBeepSound();
          } else {
            clearInterval(timer);
            countdownEl.classList.remove('active');
            resolve();
          }
        }, 1000);
      });
    }

    function captureSingleFrame() {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = video.videoWidth || 640;
      tempCanvas.height = video.videoHeight || 480;

      if (isMirror) {
        tempCtx.translate(tempCanvas.width, 0);
        tempCtx.scale(-1, 1);
      }
      
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      return tempCanvas.toDataURL('image/png');
    }

    // --- 3. FITUR UPLOAD FOTO DARI GALERI ---
    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length !== 3) {
        alert("Pilih persis 3 foto sekaligus dari galeri kamu!");
        fileInput.value = "";
        return;
      }

      const photoPromises = files.map(file => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (event) => resolve(event.target.result);
          reader.readAsDataURL(file);
        });
      });

      Promise.all(photoPromises).then(uploadedPhotos => {
        generatePhotoStrip(uploadedPhotos);
        fileInput.value = "";
      });
    });

    // --- 4. GENERATE PHOTO STRIP (ANTI GEPENG + CLASS IX-6) ---
    function generatePhotoStrip(photos) {
      const stripWidth = 400;
      const photoHeight = 280;
      const padding = 20;
      const headerHeight = 30;
      const footerHeight = 80;

      const stripHeight = headerHeight + (photoHeight * 3) + (padding * 4) + footerHeight;

      canvas.width = stripWidth;
      canvas.height = stripHeight;

      // Background Gradasi Putih - Biru
      const gradient = ctx.createLinearGradient(0, 0, 0, stripHeight);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(1, '#bae6fd');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, stripWidth, stripHeight);

      let photosLoaded = 0;

      photos.forEach((photoSrc, index) => {
        const img = new Image();
        img.src = photoSrc;
        img.onload = () => {
          const x = padding;
          const y = headerHeight + padding + index * (photoHeight + padding);
          const targetW = stripWidth - (padding * 2);
          const targetH = photoHeight;

          // LOGIKA CROP CENTER (Mencegah Foto Gepeng / Terdistorsi)
          const imgAspect = img.width / img.height;
          const targetAspect = targetW / targetH;
          let sx, sy, sWidth, sHeight;

          if (imgAspect > targetAspect) {
            sHeight = img.height;
            sWidth = img.height * targetAspect;
            sx = (img.width - sWidth) / 2;
            sy = 0;
          } else {
            sWidth = img.width;
            sHeight = img.width / targetAspect;
            sx = 0;
            sy = (img.height - sHeight) / 2;
          }

          // Gambar Foto Proporsional
          ctx.drawImage(img, sx, sy, sWidth, sHeight, x, y, targetW, targetH);

          // Border Putih Tipis
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.strokeRect(x, y, targetW, targetH);

          photosLoaded++;
          if (photosLoaded === 3) {
            drawFooterText();
          }
        };
      });

      function drawFooterText() {
        const textY = stripHeight - (footerHeight / 2);

        // Teks "class IX-6"
        ctx.fillStyle = '#0284c7';
        ctx.font = 'bold 28px "Poppins", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('class IX-6', stripWidth / 2, textY - 8);

        // Tanggal
        const dateStr = new Date().toLocaleDateString('id-ID', {
          day: 'numeric', month: 'short', year: 'numeric'
        });
        ctx.fillStyle = '#64748b';
        ctx.font = '12px "Poppins", sans-serif';
        ctx.fillText(dateStr, stripWidth / 2, textY + 20);

        // Pindah ke Halaman Hasil
        stripImg.src = canvas.toDataURL('image/png');
        showView(resultView);
      }
    }

    // --- 5. RESULT BUTTON ACTIONS ---
    downloadBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = stripImg.src;
      a.download = `Photobooth_IX-6_${Date.now()}.png`;
      a.click();
    });

    retakeBtn.addEventListener('click', () => {
      showView(cameraView);
      initCamera();
    });
  </script>
</body>
          </html>
